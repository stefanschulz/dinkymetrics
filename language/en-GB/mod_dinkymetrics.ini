MOD_DINKYMETRICS="DinkyMetrics"
; Kept here as well as in the .sys.ini: the module edit form loads only the plain
; .ini, so the manifest description would otherwise show up as a raw language key.
MOD_DINKYMETRICS_XML_DESCRIPTION="Shows a row of key figures — a number plus a caption each — with an optional count-up animation. Values are either typed in or counted from the site's own content. The module ships almost no CSS; the site styles it through a template override."

; Fieldsets

MOD_DINKYMETRICS_FIELDSET_ANIMATION="Animation"
MOD_DINKYMETRICS_FIELDSET_FORMAT="Numbers"

; Layouts

MOD_DINKYMETRICS_LAYOUT_DEFAULT="Default"
MOD_DINKYMETRICS_LAYOUT_DEFAULT_OPTION="Default"
MOD_DINKYMETRICS_LAYOUT_DEFAULT_DESC="A flat list of figures. Override it in templates/&lt;your-template&gt;/html/mod_dinkymetrics/default.php to change the markup."

; The repeatable list of figures

MOD_DINKYMETRICS_PARAM_FIGURES_LABEL="Figures"
MOD_DINKYMETRICS_PARAM_FIGURES_DESC="One row per figure, shown in this order. Rows without a caption, or whose value cannot be worked out, are skipped silently."

MOD_DINKYMETRICS_FIGURE_LABEL_LABEL="Caption"
MOD_DINKYMETRICS_FIGURE_LABEL_DESC="The text under the number, for example: Years in print. Free text — it is not a language key."

MOD_DINKYMETRICS_FIGURE_SOURCE_LABEL="Source"
MOD_DINKYMETRICS_FIGURE_SOURCE_DESC="Where the number comes from."
MOD_DINKYMETRICS_FIGURE_SOURCE_LITERAL="Fixed number"
MOD_DINKYMETRICS_FIGURE_SOURCE_YEARS_SINCE="Time since a date"
MOD_DINKYMETRICS_FIGURE_SOURCE_CONTENT_COUNT="Number of articles"
MOD_DINKYMETRICS_FIGURE_SOURCE_CATEGORY_COUNT="Number of categories"

MOD_DINKYMETRICS_FIGURE_VALUE_LABEL="Value"
MOD_DINKYMETRICS_FIGURE_VALUE_DESC="The number to show. Decimals are allowed; use a full stop as the decimal mark."

MOD_DINKYMETRICS_FIGURE_DATE_LABEL="Since"
MOD_DINKYMETRICS_FIGURE_DATE_DESC="The date to count from, written as YYYY-MM-DD — for example 1996-05-15. A date in the future results in 0."

MOD_DINKYMETRICS_FIGURE_UNIT_LABEL="Unit"
MOD_DINKYMETRICS_FIGURE_UNIT_DESC="Whole units only — the remainder is dropped, never rounded up."
MOD_DINKYMETRICS_FIGURE_UNIT_YEARS="Years"
MOD_DINKYMETRICS_FIGURE_UNIT_MONTHS="Months"
MOD_DINKYMETRICS_FIGURE_UNIT_DAYS="Days"

MOD_DINKYMETRICS_FIGURE_CATEGORY_LABEL="Category"
MOD_DINKYMETRICS_FIGURE_CATEGORY_DESC="Count articles in this category. Leave it on All categories to count the whole site."
MOD_DINKYMETRICS_FIGURE_CATEGORY_ALL="All categories"

MOD_DINKYMETRICS_FIGURE_INCLUDE_CHILDREN_LABEL="Include subcategories"
MOD_DINKYMETRICS_FIGURE_INCLUDE_CHILDREN_DESC="Yes also counts articles in every category below the chosen one."

MOD_DINKYMETRICS_FIGURE_FEATURED_LABEL="Featured articles"
MOD_DINKYMETRICS_FIGURE_FEATURED_DESC="Whether featured articles are counted."
MOD_DINKYMETRICS_FIGURE_FEATURED_ANY="Count all"
MOD_DINKYMETRICS_FIGURE_FEATURED_ONLY="Featured only"
MOD_DINKYMETRICS_FIGURE_FEATURED_EXCLUDE="Exclude featured"

MOD_DINKYMETRICS_FIGURE_EXTENSION_LABEL="Categories of"
MOD_DINKYMETRICS_FIGURE_EXTENSION_DESC="Which component's categories to count."
MOD_DINKYMETRICS_FIGURE_EXTENSION_CONTENT="Articles"
MOD_DINKYMETRICS_FIGURE_EXTENSION_CONTACT="Contacts"
MOD_DINKYMETRICS_FIGURE_EXTENSION_NEWSFEEDS="News feeds"
MOD_DINKYMETRICS_FIGURE_EXTENSION_BANNERS="Banners"

MOD_DINKYMETRICS_FIGURE_PARENT_LABEL="Below category"
MOD_DINKYMETRICS_FIGURE_PARENT_DESC="Count the categories under this one. Leave it on All categories to count every category of the component."
MOD_DINKYMETRICS_FIGURE_PARENT_ALL="All categories"

MOD_DINKYMETRICS_FIGURE_INCLUDE_CHILDREN_CAT_LABEL="Include deeper levels"
MOD_DINKYMETRICS_FIGURE_INCLUDE_CHILDREN_CAT_DESC="No counts only the categories directly below the chosen one. Yes counts every level below it."

MOD_DINKYMETRICS_FIGURE_SKIP_EMPTY_LABEL="Skip empty categories"
MOD_DINKYMETRICS_FIGURE_SKIP_EMPTY_DESC="Yes only counts categories holding at least one published article."

MOD_DINKYMETRICS_FIGURE_STATE_LABEL="Status"
MOD_DINKYMETRICS_FIGURE_STATE_DESC="Which items count. Published also honours the start and finish publishing dates."
MOD_DINKYMETRICS_FIGURE_STATE_PUBLISHED="Published"
MOD_DINKYMETRICS_FIGURE_STATE_PUBLISHED_UNPUBLISHED="Published and unpublished"
MOD_DINKYMETRICS_FIGURE_STATE_ANY="Any status, including trashed"

MOD_DINKYMETRICS_FIGURE_PREFIX_LABEL="Prefix"
MOD_DINKYMETRICS_FIGURE_PREFIX_DESC="Shown right in front of the number, for example a tilde or a plus sign. Decorative — screen readers get the whole figure as one label."

MOD_DINKYMETRICS_FIGURE_SUFFIX_LABEL="Suffix"
MOD_DINKYMETRICS_FIGURE_SUFFIX_DESC="Shown right after the number, for example a plus or a percent sign."

MOD_DINKYMETRICS_FIGURE_LINK_LABEL="Link"
MOD_DINKYMETRICS_FIGURE_LINK_DESC="Optional. Makes the figure a link. Internal targets are routed by Joomla; external ones open with rel=noopener."

; The collapsed row summary — shown for a figure until it is expanded for editing.

MOD_DINKYMETRICS_FIGURE_ADD="Add a figure"
MOD_DINKYMETRICS_FIGURE_SUMMARY_NO_LABEL="(no caption)"
MOD_DINKYMETRICS_FIGURE_SUMMARY_NO_VALUE="(no value)"
MOD_DINKYMETRICS_FIGURE_SUMMARY_YEARS_SINCE="since %1$s (%2$s)"
MOD_DINKYMETRICS_FIGURE_SUMMARY_YEARS_SINCE_NO_DATE="(no date) (%1$s)"
MOD_DINKYMETRICS_FIGURE_SUMMARY_INCLUDE_CHILDREN="incl. subcategories"
MOD_DINKYMETRICS_FIGURE_SUMMARY_FEATURED_EXCLUDE="excl. featured"
MOD_DINKYMETRICS_FIGURE_SUMMARY_ALL_LEVELS="every level"
MOD_DINKYMETRICS_FIGURE_SUMMARY_SKIP_EMPTY="skip empty"
MOD_DINKYMETRICS_FIGURE_SUMMARY_UNKNOWN_CATEGORY="category #%1$d (deleted?)"

; Animation

MOD_DINKYMETRICS_PARAM_ANIMATE_LABEL="Count up"
MOD_DINKYMETRICS_PARAM_ANIMATE_DESC="Animate the numbers on the way to their final value. The finished number is always in the page, so it stays correct without JavaScript."

MOD_DINKYMETRICS_PARAM_ANIMATE_TRIGGER_LABEL="Start counting"
MOD_DINKYMETRICS_PARAM_ANIMATE_TRIGGER_DESC="When the animation runs."
MOD_DINKYMETRICS_PARAM_ANIMATE_TRIGGER_IN_VIEW="When scrolled into view"
MOD_DINKYMETRICS_PARAM_ANIMATE_TRIGGER_ON_LOAD="Right after the page loads"

MOD_DINKYMETRICS_PARAM_ANIMATE_THRESHOLD_LABEL="Visible share"
MOD_DINKYMETRICS_PARAM_ANIMATE_THRESHOLD_DESC="How much of the module has to be on screen before it starts counting. 0 = the very first pixel, 1 = all of it."

MOD_DINKYMETRICS_PARAM_ANIMATE_DURATION_LABEL="Duration (ms)"
MOD_DINKYMETRICS_PARAM_ANIMATE_DURATION_DESC="How long the count-up takes, in milliseconds. Between 200 and 10000."

MOD_DINKYMETRICS_PARAM_ANIMATE_EASING_LABEL="Easing"
MOD_DINKYMETRICS_PARAM_ANIMATE_EASING_DESC="The speed curve of the count-up."
MOD_DINKYMETRICS_PARAM_ANIMATE_EASING_LINEAR="Even"
MOD_DINKYMETRICS_PARAM_ANIMATE_EASING_EASE_OUT="Fast start, slow finish"
MOD_DINKYMETRICS_PARAM_ANIMATE_EASING_EASE_IN_OUT="Slow start and finish"

MOD_DINKYMETRICS_PARAM_ANIMATE_FROM_LABEL="Start value"
MOD_DINKYMETRICS_PARAM_ANIMATE_FROM_DESC="The number the animation counts up from."

MOD_DINKYMETRICS_PARAM_RESPECT_REDUCED_MOTION_LABEL="Respect reduced motion"
MOD_DINKYMETRICS_PARAM_RESPECT_REDUCED_MOTION_DESC="Visitors who ask their system for reduced motion never get the animation — that holds whatever this is set to. Turning this off is therefore not a way to force the animation on them."

; Numbers

MOD_DINKYMETRICS_PARAM_FORMAT_GROUPING_LABEL="Group thousands"
MOD_DINKYMETRICS_PARAM_FORMAT_GROUPING_DESC="Separate thousands, for example 1,400 instead of 1400."

MOD_DINKYMETRICS_PARAM_FORMAT_DECIMALS_LABEL="Decimal places"
MOD_DINKYMETRICS_PARAM_FORMAT_DECIMALS_DESC="How many decimal places every figure is shown with."

MOD_DINKYMETRICS_PARAM_FORMAT_LOCALE_LABEL="Number format"
MOD_DINKYMETRICS_PARAM_FORMAT_LOCALE_DESC="A language tag such as de-DE that decides the separators. Leave it empty to follow the site language."

MOD_DINKYMETRICS_PARAM_COUNT_ALL_ACCESS_LABEL="Count restricted items"
MOD_DINKYMETRICS_PARAM_COUNT_ALL_ACCESS_DESC="No counts only what the current visitor is allowed to see. Yes counts everything regardless of access level, so every visitor sees the same number."

MOD_DINKYMETRICS_PARAM_DEBUG_LABEL="Debug"
MOD_DINKYMETRICS_PARAM_DEBUG_DESC="Log skipped rows and unresolved figures to the Joomla log. For fault finding only."
