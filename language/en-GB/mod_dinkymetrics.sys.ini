MOD_DINKYMETRICS="DinkyMetrics"
MOD_DINKYMETRICS_XML_DESCRIPTION="Shows a row of key figures — a number plus a caption each — with an optional count-up animation. Values are either typed in or counted from the site's own content. The module ships almost no CSS; the site styles it through a template override."
