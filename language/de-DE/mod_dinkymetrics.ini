MOD_DINKYMETRICS="DinkyMetrics"
; Steht bewusst auch hier und nicht nur in der .sys.ini: das Modul-Formular lädt nur
; die einfache .ini, sonst erschiene die Manifest-Beschreibung als roher Sprachschlüssel.
MOD_DINKYMETRICS_XML_DESCRIPTION="Zeigt eine Reihe von Kennzahlen — je eine Zahl mit Beschriftung — wahlweise mit Hochzähl-Animation. Die Werte werden entweder fest eingetragen oder aus dem Inhaltsbestand der Website gezählt. Das Modul bringt praktisch kein CSS mit; die Optik macht die Website per Template-Override."

