name: dinkymetrics6-test

# Throwaway Joomla 6 stack for the acceptance pass. The module is installed here
# from the BUILT ZIP (.releases/mod_dinkymetrics-<v>.zip), not symlinked, so this
# also verifies the package manifest / <media> layout.
# Routed by the shared Traefik proxy at http://dinkymetrics6.localhost/

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: joomlapw
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]

  joomla:
    image: joomla:6-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: joomlapw
      JOOMLA_DB_NAME: joomla
    volumes:
      - html-data:/var/www/html
      - ..:/repo:ro
    networks: [internal, dev-proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dev-proxy"
      - "traefik.http.routers.dinkymetrics6.rule=Host(`dinkymetrics6.localhost`)"
      - "traefik.http.routers.dinkymetrics6.entrypoints=web"
      - "traefik.http.services.dinkymetrics6.loadbalancer.server.port=80"

volumes:
  db-data:
  html-data:

networks:
  internal:
  dev-proxy:
    external: true
